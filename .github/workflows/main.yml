name: Build and Push QQ Farm Bot Image

on:
  push:
    branches: [ main, master ]   # 推送到这些分支时自动构建
  workflow_dispatch:            # 也支持在 Actions 页面手动点击构建

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # 自动使用你的用户名/仓库名，例如 yourname/qq-farm-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置 QEMU，让 x86 的 GitHub Runner 能模拟构建 ARM64 镜像
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx，用于多平台构建
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送镜像
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .                # 构建上下文为仓库根目录
          file: ./core        # 如果 Dockerfile 在子目录，请修改此路径，例如 ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
